<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot 100 Go 速通模板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: one reading column of chapter sections, each a header + template + problem cards;
   a sticky bar on top carries progress, filters and the chapter strip. */
:root {
  --bg: #f5f6f4;
  --card: #ffffff;
  --ink: #1d2422;
  --muted: #69736f;
  --line: #e3e7e4;
  --code-bg: #f2f4f2;
  --accent: #0e5a52;       /* chapter numbers, Day tag, focus */
  --good: #1f8a57;         /* 掌握 */
  --good-bg: #e6f4ec;
  --warn: #a8661a;         /* 要复习, 中等 */
  --warn-bg: #fbf0dd;
  --bad: #c3392f;          /* 困难, 高频, 易错 */
  --bad-bg: #fcebe9;
  --hl-k: #a31f6f; --hl-t: #0e6b78; --hl-s: #2f7a2f; --hl-n: #9a5a00; --hl-c: #8b948f; --hl-f: #2b4fa8; --hl-b: #7b3fb0;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --card: #1a201e; --ink: #e4e9e6; --muted: #93a09a; --line: #2a3330; --code-bg: #141917;
    --accent: #5cc4b4; --good: #4cc488; --good-bg: #173326; --warn: #e2a654; --warn-bg: #352a17; --bad: #f07a6e; --bad-bg: #3a1f1c;
    --hl-k: #f283c0; --hl-t: #5fc7d4; --hl-s: #8fd18b; --hl-n: #f0b45e; --hl-c: #6f7b76; --hl-f: #8eaaf5; --hl-b: #c59af0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --card: #1a201e; --ink: #e4e9e6; --muted: #93a09a; --line: #2a3330; --code-bg: #141917;
  --accent: #5cc4b4; --good: #4cc488; --good-bg: #173326; --warn: #e2a654; --warn-bg: #352a17; --bad: #f07a6e; --bad-bg: #3a1f1c;
  --hl-k: #f283c0; --hl-t: #5fc7d4; --hl-s: #8fd18b; --hl-n: #f0b45e; --hl-c: #6f7b76; --hl-f: #8eaaf5; --hl-b: #c59af0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.75 var(--font-body); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 760px; margin: 0 auto; padding: 12px 16px 10px; display: grid; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; margin: 0; letter-spacing: .01em; }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-state="ok"]::before { background: var(--good); }
.sync[data-state="busy"]::before { background: var(--warn); }
.sync[data-state="err"]::before { background: var(--bad); }
.meter { flex: 1 1 200px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.track i { display: block; height: 100%; transition: width .3s; }
.track .m { background: var(--good); }
.track .r { background: var(--warn); }
.meter b { color: var(--ink); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }
.search { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 12px; font-size: 13px; width: 130px; }
.day-select { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 8px; font-size: 13px; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.strip a { flex: none; text-decoration: none; color: var(--muted); font-size: 12px; border-radius: 6px; padding: 2px 8px; border: 1px solid transparent; white-space: nowrap; font-variant-numeric: tabular-nums; }
.strip a:hover { border-color: var(--line); color: var(--ink); }
.strip a .no { font-family: var(--font-mono); font-weight: 600; color: var(--accent); margin-right: 4px; }
.strip a.done { color: var(--good); }
.strip .day { flex: none; font-size: 11px; font-weight: 700; color: var(--accent); align-self: center; padding: 0 2px 0 6px; }

/* ---------- content ---------- */
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 44px; }
.intro { color: var(--muted); font-size: 14px; margin: 0; max-width: 62ch; }
.chapter { display: grid; gap: 16px; scroll-margin-top: 150px; }
.ch-head { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; align-items: end; }
.ch-no { font-family: var(--font-mono); font-weight: 800; font-size: 46px; line-height: .9; color: var(--accent); letter-spacing: -.03em; }
.ch-title { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800; text-wrap: balance; }
.ch-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tag-day { border: 1.5px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 0 6px; font-weight: 700; font-size: 12px; font-family: var(--font-mono); }
.when { margin: 0; font-size: 16px; max-width: 64ch; }
.pitfalls { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; color: var(--muted); }
.pitfalls li { display: grid; grid-template-columns: 18px 1fr; }
.pitfalls li::before { content: "○"; color: var(--good); font-weight: 700; }

.tpl { background: var(--code-bg); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.tpl-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 0; font-weight: 700; font-size: 14px; }
.tpl-head .lab { color: var(--accent); font-size: 12px; }
.copy { margin-left: auto; border: 1px solid var(--line); background: var(--card); border-radius: 6px; font-size: 12px; padding: 1px 10px; cursor: pointer; color: var(--muted); }
.copy:hover { color: var(--ink); }
pre { margin: 0; padding: 10px 14px 14px; overflow-x: auto; font: 13px/1.6 var(--font-mono); tab-size: 4; }
.lang { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 6px 14px 0; letter-spacing: .08em; }
pre .k { color: var(--hl-k); } pre .t { color: var(--hl-t); } pre .s { color: var(--hl-s); } pre .n { color: var(--hl-n); }
pre .c { color: var(--hl-c); font-style: italic; } pre .f { color: var(--hl-f); } pre .b { color: var(--hl-b); }

.cards { display: grid; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; scroll-margin-top: 150px; border-left: 4px solid var(--line); }
.card[data-s="m"] { border-left-color: var(--good); }
.card[data-s="r"] { border-left-color: var(--warn); }
.p-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.p-id { font-family: var(--font-mono); font-weight: 800; font-size: 20px; color: var(--accent); text-decoration: none; }
.p-id:hover { text-decoration: underline; }
.p-title { font-size: 19px; font-weight: 800; margin: 0; }
.tag { font-size: 12px; font-weight: 700; border-radius: 5px; padding: 0 6px; line-height: 20px; border: 1px solid; }
.d-easy { color: var(--good); border-color: transparent; background: var(--good-bg); }
.d-mid { color: var(--warn); border-color: transparent; background: var(--warn-bg); }
.d-hard { color: var(--bad); border-color: transparent; background: var(--bad-bg); }
.hot { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.seq { font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.acts { display: flex; gap: 8px; }
.act { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.act:hover { color: var(--ink); }
.act.m[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
.act.r[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); font-weight: 700; }
.insight { margin: 0; }
.insight em, .when em { font-style: normal; font-weight: 700; color: var(--ink); }
.trap { display: grid; grid-template-columns: auto 1fr; gap: 10px; color: var(--muted); font-size: 14px; }
.trap .tag { align-self: start; margin-top: 2px; }
.cx { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cx b { color: var(--ink); }
details { border-top: 1px dashed var(--line); padding-top: 6px; }
summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: 14px; list-style: none; display: flex; gap: 8px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; transition: transform .15s; }
details[open] summary::before { transform: rotate(90deg); }
summary .ln { color: var(--muted); font-weight: 400; }
summary .copy { font-weight: 400; }
details pre { background: var(--code-bg); border-radius: 10px; margin-top: 8px; padding: 12px 14px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }
[hidden] { display: none !important; }

@media (max-width: 480px) {
  .ch-no { font-size: 36px; }
  .search { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="bar-row">
      <h1 class="brand">Hot 100 Go 速通模板</h1>
      <span class="sync" id="sync" data-state="local">仅存本机</span>
    </div>
    <div class="bar-row">
      <div class="meter" aria-live="polite">
        <span>已掌握 <b id="m-count">0</b>/<span id="total">0</span></span>
        <span class="track" aria-hidden="true"><i class="m" id="m-bar"></i><i class="r" id="r-bar"></i></span>
        <span>要复习 <b id="r-count">0</b></span>
      </div>
    </div>
    <div class="bar-row">
      <div class="chips" role="group" aria-label="筛选">
        <button class="chip" data-filter="all" aria-pressed="true">全部</button>
        <button class="chip" data-filter="todo" aria-pressed="false">未掌握<span class="n" id="n-todo"></span></button>
        <button class="chip" data-filter="review" aria-pressed="false">要复习<span class="n" id="n-review"></span></button>
        <button class="chip" data-filter="hot" aria-pressed="false">高频<span class="n" id="n-hot"></span></button>
      </div>
      <select class="day-select" id="day" aria-label="按天筛选">
        <option value="">全部天</option>
        <!--DAY_OPTIONS-->
      </select>
      <input class="search" id="q" type="search" placeholder="题号或题名" aria-label="搜索题号或题名">
    </div>
    <nav class="strip" aria-label="章节"><!--STRIP--></nav>
  </div>
</header>
<main id="main">
  <p class="intro"><!--INTRO--></p>
  <!--CHAPTERS-->
  <p class="empty" id="empty" hidden>没有符合条件的题。换个筛选试试。</p>
  <p class="foot"><!--FOOT--></p>
</main>
<script>
/*__CORE__*/
</script>
<script>
(() => {
  const LS_KEY = "hot100-go-progress-v1";
  const UI_KEY = "hot100-go-ui-v1";
  const cards = [...document.querySelectorAll(".card")];
  const chapters = [...document.querySelectorAll(".chapter")];
  const byId = new Map(cards.map((c) => [c.dataset.id, c]));
  let items = {};
  let ui = { filter: "all", day: "", q: "" };

  // ---------- storage ----------
  function loadLocal() {
    try { items = sanitize(JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch { items = {}; }
    try { ui = { ...ui, ...JSON.parse(localStorage.getItem(UI_KEY) || "{}") }; } catch {}
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch {}
  }
  function saveUi() {
    try { localStorage.setItem(UI_KEY, JSON.stringify({ filter: ui.filter, day: ui.day })); } catch {}
  }

  // ---------- render ----------
  function render() {
    let m = 0, r = 0, hot = 0;
    for (const c of cards) {
      const s = statusOf(items, c.dataset.id);
      c.dataset.s = s;
      c.querySelector(".act.m").setAttribute("aria-pressed", String(s === "m"));
      c.querySelector(".act.r").setAttribute("aria-pressed", String(s === "r"));
      if (s === "m") m++;
      if (s === "r") r++;
      if (c.dataset.hot === "1") hot++;
    }
    const total = cards.length;
    document.getElementById("m-count").textContent = m;
    document.getElementById("r-count").textContent = r;
    document.getElementById("total").textContent = total;
    document.getElementById("m-bar").style.width = (100 * m / total) + "%";
    document.getElementById("r-bar").style.width = (100 * r / total) + "%";
    document.getElementById("n-todo").textContent = total - m;
    document.getElementById("n-review").textContent = r;
    document.getElementById("n-hot").textContent = hot;

    for (const ch of chapters) {
      const cs = [...ch.querySelectorAll(".card")];
      const done = cs.filter((c) => c.dataset.s === "m").length;
      ch.querySelector(".ch-done").textContent = done;
      const link = document.querySelector(`.strip a[href="#${ch.id}"]`);
      if (link) {
        link.querySelector(".pg").textContent = `${done}/${cs.length}`;
        link.classList.toggle("done", done === cs.length);
      }
    }
    applyFilter();
  }

  function matches(c) {
    const s = c.dataset.s;
    if (ui.filter === "todo" && s === "m") return false;
    if (ui.filter === "review" && s !== "r") return false;
    if (ui.filter === "hot" && c.dataset.hot !== "1") return false;
    if (ui.day && c.closest(".chapter").dataset.day !== ui.day) return false;
    const q = ui.q.trim().toLowerCase();
    if (q && !(c.dataset.id === q || c.dataset.title.toLowerCase().includes(q) || c.dataset.id.startsWith(q))) return false;
    return true;
  }

  function applyFilter() {
    let any = false;
    const narrowed = ui.filter !== "all" || ui.day || ui.q.trim();
    for (const ch of chapters) {
      let shown = 0;
      for (const c of ch.querySelectorAll(".card")) {
        const ok = matches(c);
        c.hidden = !ok;
        if (ok) shown++;
      }
      ch.hidden = shown === 0;
      // While filtering, the template and chapter notes get in the way of a quick review pass.
      for (const el of ch.querySelectorAll(".when, .pitfalls, .tpl")) el.hidden = !!narrowed;
      if (shown) any = true;
    }
    document.getElementById("empty").hidden = any;
    for (const b of document.querySelectorAll(".chip")) b.setAttribute("aria-pressed", String(b.dataset.filter === ui.filter));
    document.getElementById("day").value = ui.day;
  }

  // ---------- sync ----------
  const syncEl = document.getElementById("sync");
  function setSync(state, text) { syncEl.dataset.state = state; syncEl.textContent = text; }

  let docRef = null;
  let remote = null;          // last state the store confirmed
  let writing = false, dirty = false, timer = 0;

  function scheduleWrite() {
    if (!docRef) return;
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(flush, 700);
  }
  async function flush() {
    if (!docRef || writing || !dirty) return;
    if (remote && sameState(remote, items)) { dirty = false; return; }
    writing = true; dirty = false;
    setSync("busy", "同步中…");
    const body = { v: 1, items: { ...items } };
    try {
      await docRef.set(body);
      remote = body.items;
      setSync("ok", "已同步");
    } catch (e) {
      if (e && e.code === "unavailable") { dirty = true; setTimeout(flush, 1500 + Math.random() * 1500); setSync("busy", "重试中…"); }
      else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { docRef = null; setSync("local", "仅存本机"); }
      else setSync("err", "同步失败，已存本机");
    } finally {
      writing = false;
      if (dirty) flush();
    }
  }

  async function connect() {
    try {
      // The host may inject `claude` after this script runs; give it a few seconds.
      for (let i = 0; i < 20 && !(window.claude && typeof window.claude.use === "function"); i++) {
        await new Promise((r) => setTimeout(r, 250));
      }
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      docRef = db.collection("data/users/" + uid).doc("hot100-progress");
      setSync("busy", "连接中…");
      const slow = setTimeout(() => setSync("err", "暂时连不上，已存本机"), 10000);
      docRef.onSnapshot((snap) => {
        if (!snap.metadata.fromCache) clearTimeout(slow);
        const theirs = snap.exists ? sanitize((snap.data() || {}).items) : {};
        if (!snap.metadata.hasPendingWrites && !snap.metadata.fromCache) remote = theirs;
        const merged = merge(items, theirs);
        if (!sameState(merged, items)) { items = merged; saveLocal(); render(); }
        if (!snap.metadata.fromCache) {
          if (!sameState(items, theirs)) scheduleWrite();
          else if (!writing) setSync("ok", "已同步");
        }
      }, (e) => {
        clearTimeout(slow);
        docRef = null;
        setSync(e && e.code === "revoked" ? "local" : "err", "同步中断，已存本机");
      });
    } catch {
      docRef = null;
    }
  }

  // ---------- events ----------
  document.addEventListener("click", async (ev) => {
    const act = ev.target.closest(".act");
    if (act) {
      const id = act.closest(".card").dataset.id;
      items = mark(items, id, act.classList.contains("m") ? "m" : "r", Date.now());
      saveLocal(); render(); scheduleWrite();
      return;
    }
    const chip = ev.target.closest(".chip");
    if (chip) { ui.filter = chip.dataset.filter; saveUi(); applyFilter(); return; }
    const copy = ev.target.closest(".copy");
    if (copy) {
      ev.preventDefault(); // inside <summary> this would toggle the code
      const pre = document.getElementById(copy.dataset.for);
      const text = pre.textContent;
      try {
        await navigator.clipboard.writeText(text);
        copy.textContent = "已复制";
      } catch {
        const sel = getSelection(); const range = document.createRange();
        range.selectNodeContents(pre); sel.removeAllRanges(); sel.addRange(range);
        copy.textContent = "已选中，按 ⌘C";
      }
      setTimeout(() => (copy.textContent = "复制"), 1500);
    }
  });
  document.getElementById("day").addEventListener("change", (e) => { ui.day = e.target.value; saveUi(); applyFilter(); });
  document.getElementById("q").addEventListener("input", (e) => { ui.q = e.target.value; applyFilter(); });

  function showHash() {
    const h = location.hash.slice(1);
    if (!h) return;
    const el = document.getElementById(h);
    if (!el) return;
    if (el.hidden || (el.closest(".chapter") || {}).hidden) { ui = { ...ui, filter: "all", day: "", q: "" }; document.getElementById("q").value = ""; applyFilter(); }
    el.scrollIntoView({ block: "start" });
  }
  addEventListener("hashchange", showHash);

  loadLocal();
  render();
  showHash();
  connect();
})();
</script>
</body>
</html>
